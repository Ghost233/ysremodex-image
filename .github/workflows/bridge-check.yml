name: Bridge Check

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Ghost233/remodex ref to check"
        required: false
        default: "ghost"
  schedule:
    - cron: "11 4 * * *"

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: Ghost233/remodex
  SOURCE_REF: ${{ github.event.inputs.source_ref || 'ghost' }}

jobs:
  bridge-check:
    runs-on: ubuntu-latest

    steps:
      - name: Verify source repository token
        env:
          REMODEX_SOURCE_PAT: ${{ secrets.REMODEX_SOURCE_PAT }}
        run: |
          if [ -z "${REMODEX_SOURCE_PAT}" ]; then
            echo "::error title=Missing source token::Set the REMODEX_SOURCE_PAT repository secret with read access to Ghost233/remodex."
            exit 1
          fi

      - name: Checkout bridge source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.REMODEX_SOURCE_PAT }}
          path: remodex-src
          sparse-checkout: phodex-bridge
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remodex-src/phodex-bridge/package-lock.json

      - name: Install bridge dependencies
        working-directory: remodex-src/phodex-bridge
        run: npm ci

      - name: Verify bridge entrypoints load
        working-directory: remodex-src/phodex-bridge
        run: |
          node -e "const mod = require('./src'); const names = ['startBridge', 'openLastActiveThread', 'watchThreadRollout']; for (const name of names) { if (typeof mod[name] !== 'function') { throw new Error('Missing export: ' + name); } }"
